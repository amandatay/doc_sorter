<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- CSP: self + inline scripts/styles + blob:/data: images. No external connects. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'">
  <title>DocSorter</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- ============================================================
       M0: App shell styles
       Portrait layout, 44px min tap targets, one-handed use.
       ============================================================ -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #202124;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    #screen-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    #bottom-nav {
      display: flex;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, .08);
      position: relative;
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 56px;
      padding: 6px 0;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: #5f6368;
      letter-spacing: .3px;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }

    .nav-btn.active { color: #1a73e8; }

    .nav-icon { font-size: 22px; line-height: 1; }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 40px 24px;
      text-align: center;
      color: #80868b;
      gap: 12px;
    }

    .placeholder .placeholder-icon { font-size: 48px; }
    .placeholder h2 { font-size: 20px; font-weight: 500; color: #3c4043; }
    .placeholder p  { font-size: 14px; line-height: 1.5; max-width: 260px; }
  </style>

  <!-- ============================================================
       M1: App header + settings bottom sheet styles
       ============================================================ -->
  <style>
    #app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 16px;
      height: 56px;
      flex-shrink: 0;
      background: #1a73e8;
      color: #fff;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
      position: relative;
      z-index: 10;
    }

    #app-title { font-size: 20px; font-weight: 500; letter-spacing: .15px; }

    #btn-settings {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 50%;
      color: #fff; font-size: 22px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #settings-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, .4);
      z-index: 100;
    }

    #settings-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 12px 24px max(24px, env(safe-area-inset-bottom, 0px));
      z-index: 101;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, .15);
      max-height: 80vh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #dadce0; border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-title { font-size: 18px; font-weight: 500; color: #202124; margin-bottom: 8px; }

    .settings-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f1f3f4;
    }
    .settings-row:last-of-type { border-bottom: none; }

    .settings-label { font-size: 14px; color: #5f6368; }
    .settings-value { font-size: 14px; font-weight: 500; color: #202124; text-align: right; }

    #btn-settings-close {
      display: block; width: 100%; margin-top: 20px;
      padding: 14px; background: #1a73e8; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer; min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <!-- ============================================================
       M2: Inbox screen styles — import bar, progress, thumbnail grid
       ============================================================ -->
  <style>
    /* ---- Import bar ---- */
    #inbox-import-bar {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    #btn-import {
      display: block; width: 100%;
      padding: 14px; background: #1a73e8; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer; min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---- Progress bar ---- */
    #import-progress {
      padding: 10px 16px 12px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }

    #progress-track {
      height: 4px; background: #e8eaed;
      border-radius: 2px; overflow: hidden;
    }

    #progress-fill {
      height: 100%; width: 0%;
      background: #1a73e8;
      border-radius: 2px;
      transition: width .1s linear;
    }

    #progress-text {
      font-size: 12px; color: #5f6368;
      margin-top: 6px; text-align: center;
    }

    /* ---- Thumbnail grid ---- */
    #inbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
    }

    .thumb-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #e8eaed;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .thumb-cell img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* "~" badge: timestamp came from file modification date, not EXIF */
    .thumb-badge {
      position: absolute; top: 4px; left: 4px;
      background: rgba(0, 0, 0, .55);
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
      line-height: 1.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- ============================================================
     M0: App shell — header, screens, bottom nav
     ============================================================ -->
<div id="app">

  <!-- ============================================================
       M1: App header with settings button
       ============================================================ -->
  <header id="app-header">
    <span id="app-title">DocSorter</span>
    <button id="btn-settings" aria-label="Open settings">⚙</button>
  </header>

  <div id="screen-container">

    <!-- ============================================================
         Documents screen (M4+)
         ============================================================ -->
    <div id="screen-documents" class="screen active" role="main" aria-label="Documents">
      <div class="placeholder">
        <div class="placeholder-icon" aria-hidden="true">📄</div>
        <h2>Documents</h2>
        <p>Your saved documents will appear here.</p>
      </div>
    </div>

    <!-- ============================================================
         Inbox screen (M2)
         Import photos, view thumbnails sorted by capture time.
         ============================================================ -->
    <div id="screen-inbox" class="screen" role="main" aria-label="Inbox">

      <div id="inbox-import-bar">
        <button id="btn-import">+ Import photos</button>
        <input id="file-input" type="file" accept="image/*" multiple
               hidden aria-hidden="true" tabindex="-1">
      </div>

      <div id="import-progress" hidden>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <p id="progress-text" aria-live="polite"></p>
      </div>

      <div id="inbox-grid" role="list" aria-label="Imported pages"></div>

      <div id="inbox-empty" class="placeholder">
        <div class="placeholder-icon" aria-hidden="true">📥</div>
        <h2>Inbox is empty</h2>
        <p>Tap <strong>Import photos</strong> to add photos from your gallery.</p>
      </div>

    </div>

  </div><!-- /screen-container -->

  <nav id="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-screen="documents" aria-current="page">
      <span class="nav-icon" aria-hidden="true">📄</span>
      <span>Documents</span>
    </button>
    <button class="nav-btn" data-screen="inbox" aria-current="false">
      <span class="nav-icon" aria-hidden="true">📥</span>
      <span>Inbox</span>
    </button>
  </nav>

</div><!-- /app -->

<!-- ============================================================
     M1: Settings bottom sheet
     ============================================================ -->
<div id="settings-backdrop" hidden aria-hidden="true"></div>
<div id="settings-sheet" hidden role="dialog" aria-label="Settings" aria-modal="true">
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 class="sheet-title">Settings</h2>
  <div class="settings-row">
    <span class="settings-label">Storage persistence</span>
    <span class="settings-value" id="storage-persist-status">Checking…</span>
  </div>
  <div class="settings-row">
    <span class="settings-label">Storage used</span>
    <span class="settings-value" id="storage-usage">Checking…</span>
  </div>
  <div class="settings-row">
    <span class="settings-label">Schema version</span>
    <span class="settings-value">1</span>
  </div>
  <button id="btn-settings-close">Done</button>
</div>

<script src="core.js"></script>
<script src="vendor/exifr/exifr.umd.js"></script>

<!-- ============================================================
     M0: Navigation + service worker registration
     ============================================================ -->
<script>
(function () {
  'use strict';

  const screens = document.querySelectorAll('.screen');
  const navBtns = document.querySelectorAll('.nav-btn');

  function showScreen(name) {
    screens.forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
    navBtns.forEach(b => {
      const active = b.dataset.screen === name;
      b.classList.toggle('active', active);
      b.setAttribute('aria-current', active ? 'page' : 'false');
    });
  }

  navBtns.forEach(btn => btn.addEventListener('click', () => showScreen(btn.dataset.screen)));

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  }
}());
</script>

<!-- ============================================================
     M1: IndexedDB wrapper
     Two stores: blobs (images + thumbnails) and state (manifest).
     ============================================================ -->
<script>
const DB = (() => {
  const DB_NAME    = 'docsorter';
  const DB_VERSION = 1;
  let _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('state')) db.createObjectStore('state');
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror   = e => reject(e.target.error);
    });
  }

  function tx(store, mode, fn) {
    return open().then(db => new Promise((resolve, reject) => {
      const t   = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    }));
  }

  return {
    open,
    saveState: state  => tx('state', 'readwrite', s => s.put(state, 'current')),
    loadState: ()     => tx('state', 'readonly',  s => s.get('current')),
    saveBlob:  (k, b) => tx('blobs', 'readwrite', s => s.put(b, k)),
    loadBlob:  k      => tx('blobs', 'readonly',  s => s.get(k)),
    deleteBlob: k     => tx('blobs', 'readwrite', s => s.delete(k)),
  };
})();
</script>

<!-- ============================================================
     M1: App state + initialization
     Loads state from IndexedDB on startup; requests storage persistence.
     ============================================================ -->
<script>
const App = {
  state:           null,
  persisted:       null,
  storageEstimate: null,
};

async function initApp() {
  try {
    await DB.open();
    const saved = await DB.loadState();
    App.state = saved ? Core.applyMigrations(saved) : Core.createState();
    const errs = Core.validateState(App.state);
    if (errs.length) console.warn('State validation warnings:', errs);
    await DB.saveState(App.state);
  } catch (err) {
    console.error('Storage init failed, running in-memory only:', err);
    App.state = Core.createState();
  }

  if (navigator.storage && navigator.storage.persist) {
    try { App.persisted = await navigator.storage.persist(); } catch (e) {}
  }

  if (navigator.storage && navigator.storage.estimate) {
    try { App.storageEstimate = await navigator.storage.estimate(); } catch (e) {}
  }

  renderSettings();
  await renderInbox(); // renderInbox is defined in the M2 block below
}

function renderSettings() {
  const persistEl = document.getElementById('storage-persist-status');
  const usageEl   = document.getElementById('storage-usage');

  if (App.persisted === true)       persistEl.textContent = 'Granted';
  else if (App.persisted === false) persistEl.textContent = 'Not granted';
  else                              persistEl.textContent = 'Not supported';

  if (App.storageEstimate) {
    const usedMB  = (App.storageEstimate.usage  / 1048576).toFixed(1);
    const quotaMB = (App.storageEstimate.quota   / 1048576).toFixed(0);
    usageEl.textContent = usedMB + ' MB of ' + quotaMB + ' MB';
  } else {
    usageEl.textContent = 'Unknown';
  }
}

initApp(); // starts async; M2 functions are defined before any await resolves
</script>

<!-- ============================================================
     M1: Settings panel open/close
     ============================================================ -->
<script>
(function () {
  const backdrop = document.getElementById('settings-backdrop');
  const sheet    = document.getElementById('settings-sheet');
  const btnOpen  = document.getElementById('btn-settings');
  const btnClose = document.getElementById('btn-settings-close');

  function openSettings()  { backdrop.hidden = false; sheet.hidden = false; btnClose.focus(); }
  function closeSettings() { backdrop.hidden = true;  sheet.hidden = true;  btnOpen.focus(); }

  btnOpen.addEventListener('click', openSettings);
  btnClose.addEventListener('click', closeSettings);
  backdrop.addEventListener('click', closeSettings);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSettings(); });
}());
</script>

<!-- ============================================================
     M2: Gallery import — EXIF reading, thumbnail generation, progress
     Processes files one at a time, yielding between each to stay responsive.
     ============================================================ -->
<script>
const THUMB_MAX_LONG_EDGE = 400;
const THUMB_QUALITY       = 0.8;
const SAVE_INTERVAL       = 10; // persist state every N files

function showImportProgress(done, total) {
  const bar = document.getElementById('import-progress');
  bar.hidden = false;
  document.getElementById('progress-fill').style.width = (done / total * 100) + '%';
  document.getElementById('progress-text').textContent =
    done < total ? 'Importing ' + done + ' of ' + total + '…' : 'Finishing up…';
}

function hideImportProgress() {
  document.getElementById('import-progress').hidden = true;
  document.getElementById('progress-fill').style.width = '0%';
}

async function generateThumbnail(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode(); // throws for HEIC and other unsupported formats
    const { naturalWidth: w, naturalHeight: h } = img;
    const scale = Math.min(THUMB_MAX_LONG_EDGE / w, THUMB_MAX_LONG_EDGE / h, 1);
    const tw = Math.round(w * scale);
    const th = Math.round(h * scale);
    const canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    canvas.getContext('2d').drawImage(img, 0, 0, tw, th);
    const thumbBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', THUMB_QUALITY));
    return { thumbBlob, width: w, height: h };
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function importOneFile(file) {
  let capturedAt, capturedAtSource;
  try {
    const exifData = await exifr.parse(file);
    if (exifData && exifData.DateTimeOriginal instanceof Date) {
      capturedAt = Core.formatLocalDateTime(exifData.DateTimeOriginal);
      capturedAtSource = 'exif';
    }
  } catch (e) { /* EXIF unavailable — fall through to lastModified */ }

  if (!capturedAt) {
    capturedAt = Core.formatLocalDateTime(new Date(file.lastModified));
    capturedAtSource = 'lastModified';
  }

  const { thumbBlob, width, height } = await generateThumbnail(file);

  const pageId = Core.generateId();
  const page   = Core.createPage({
    originalName: file.name,
    mime: file.type || 'image/jpeg',
    capturedAt, capturedAtSource, width, height,
  });

  await DB.saveBlob(pageId, file);
  await DB.saveBlob(pageId + ':thumb', thumbBlob);

  App.state = Core.addPageToInbox(App.state, pageId, page);
}

async function handleImport(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;

  let failCount = 0;
  showImportProgress(0, files.length);

  for (let i = 0; i < files.length; i++) {
    try {
      await importOneFile(files[i]);
    } catch (err) {
      console.warn('Could not import', files[i].name, '—', err.message);
      failCount++;
    }
    showImportProgress(i + 1, files.length);
    if ((i + 1) % SAVE_INTERVAL === 0) await DB.saveState(App.state);
    await new Promise(r => setTimeout(r, 0)); // yield to keep UI responsive
  }

  await DB.saveState(App.state);
  hideImportProgress();
  await renderInbox();

  if (failCount) {
    alert(failCount + ' photo' + (failCount === 1 ? '' : 's') +
      ' could not be imported. The format may not be supported by your browser (e.g. HEIC).');
  }
}

(function () {
  const input = document.getElementById('file-input');
  document.getElementById('btn-import').addEventListener('click', () => input.click());
  input.addEventListener('change', async e => {
    const files = e.target.files;
    e.target.value = ''; // reset so the same files can be selected again
    await handleImport(files);
  });
}());
</script>

<!-- ============================================================
     M2: Inbox rendering — displays thumbnails sorted by capture time
     ============================================================ -->
<script>
let _inboxObjectURLs = []; // tracked so we can revoke when re-rendering

function revokeInboxURLs() {
  _inboxObjectURLs.forEach(u => URL.revokeObjectURL(u));
  _inboxObjectURLs = [];
}

async function renderInbox() {
  const grid  = document.getElementById('inbox-grid');
  const empty = document.getElementById('inbox-empty');

  revokeInboxURLs();
  grid.innerHTML = '';

  const entries = Core.sortedInboxEntries(App.state);

  if (!entries.length) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  // Create all cells synchronously first so the grid appears immediately
  const cells = entries.map(([pageId, page], i) => {
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    cell.dataset.pageId = pageId;
    cell.setAttribute('role', 'listitem');

    const img = document.createElement('img');
    img.alt = 'Page ' + (i + 1);

    if (page.capturedAtSource === 'lastModified') {
      const badge = document.createElement('span');
      badge.className = 'thumb-badge';
      badge.setAttribute('aria-label', 'estimated timestamp');
      badge.title = 'Timestamp from file date — camera time not available';
      badge.textContent = '~';
      cell.appendChild(badge);
    }

    cell.appendChild(img);
    grid.appendChild(cell);
    return { img, pageId };
  });

  // Load all thumbnails from IndexedDB concurrently
  await Promise.all(cells.map(async ({ img, pageId }) => {
    const blob = await DB.loadBlob(pageId + ':thumb');
    if (blob) {
      const url = URL.createObjectURL(blob);
      _inboxObjectURLs.push(url);
      img.src = url;
    }
  }));
}
</script>

</body>
</html>
